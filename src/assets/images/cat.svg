<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cat Body -->
  <ellipse cx="100" cy="120" rx="45" ry="55" fill="#ff9f43" stroke="#333" stroke-width="2"/>

  <!-- Cat Head -->
  <circle cx="100" cy="70" r="35" fill="#ff9f43" stroke="#333" stroke-width="2"/>

  <!-- Left Ear -->
  <path d="M 75 50 L 65 25 L 85 45 Z" fill="#ff9f43" stroke="#333" stroke-width="2"/>
  <path d="M 75 48 L 68 30 L 82 45 Z" fill="#ffbe76"/>

  <!-- Right Ear -->
  <path d="M 125 50 L 135 25 L 115 45 Z" fill="#ff9f43" stroke="#333" stroke-width="2"/>
  <path d="M 125 48 L 132 30 L 118 45 Z" fill="#ffbe76"/>

  <!-- Left Eye -->
  <ellipse cx="88" cy="68" rx="6" ry="8" fill="#333"/>
  <circle cx="89" cy="66" r="2" fill="#fff"/>

  <!-- Right Eye -->
  <ellipse cx="112" cy="68" rx="6" ry="8" fill="#333"/>
  <circle cx="113" cy="66" r="2" fill="#fff"/>

  <!-- Nose -->
  <path d="M 100 78 L 97 82 L 103 82 Z" fill="#333"/>

  <!-- Mouth -->
  <path d="M 100 82 Q 95 88 90 86" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <path d="M 100 82 Q 105 88 110 86" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>

  <!-- Whiskers Left -->
  <line x1="70" y1="72" x2="50" y2="70" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="76" x2="50" y2="78" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Whiskers Right -->
  <line x1="130" y1="72" x2="150" y2="70" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="130" y1="76" x2="150" y2="78" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Front Left Paw -->
  <ellipse cx="80" cy="165" rx="10" ry="15" fill="#ff9f43" stroke="#333" stroke-width="2"/>

  <!-- Front Right Paw -->
  <ellipse cx="120" cy="165" rx="10" ry="15" fill="#ff9f43" stroke="#333" stroke-width="2"/>

  <!-- Tail -->
  <path d="M 135 130 Q 160 120 165 95" fill="none" stroke="#ff9f43" stroke-width="18" stroke-linecap="round"/>
  <path d="M 135 130 Q 160 120 165 95" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>

  <!-- Belly Spot -->
  <ellipse cx="100" cy="135" rx="25" ry="30" fill="#ffbe76" opacity="0.6"/>
</svg>
